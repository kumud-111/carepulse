server:
  port: 8080
spring:
  datasource:
    # Default: H2 file database (no install needed). Switch to PostgreSQL with env vars:
    #   DB_URL=jdbc:postgresql://localhost:5432/carepulse DB_USER=... DB_PASSWORD=... DB_DRIVER=org.postgresql.Driver
    url: ${DB_URL:jdbc:h2:file:./data/carepulse;AUTO_SERVER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
carepulse:
  jwt-secret: ${JWT_SECRET:change-this-dev-secret-to-at-least-32-characters-long}
  jwt-hours: 72
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
